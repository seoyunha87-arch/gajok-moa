<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#3B6E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가족모아">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>가족모아 — 가족 일정·사진 공유 앱</title>
<style>
:root{
  --bg:#F3F0E7;
  --bg-2:#ECE7D9;
  --ink:#242A20;
  --ink-soft:#5B6152;
  --primary:#3B6E5E;
  --primary-dark:#2A5346;
  --primary-tint:#E4EEE9;
  --accent:#E8A23D;
  --accent-tint:#FBEED9;
  --rose:#C4577A;
  --rose-tint:#F6E4EA;
  --line:#DCD6C4;
  --card:#FFFDF8;
  --card-2:#FAF6EC;
  --shadow: 0 1px 2px rgba(36,42,32,.06), 0 8px 24px -12px rgba(36,42,32,.18);
  --radius-l:22px;
  --radius-m:16px;
  --radius-s:10px;
  --font-ui: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
:root[data-theme="dark"]{
  --bg:#1B1D17;
  --bg-2:#232519;
  --ink:#EDEAE0;
  --ink-soft:#A8AA9B;
  --primary:#6FA890;
  --primary-dark:#8CC0AA;
  --primary-tint:#22332C;
  --accent:#E8B563;
  --accent-tint:#332A17;
  --rose:#D989A0;
  --rose-tint:#332025;
  --line:#3A3B2F;
  --card:#242619;
  --card-2:#2A2C1E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D17;
    --bg-2:#232519;
    --ink:#EDEAE0;
    --ink-soft:#A8AA9B;
    --primary:#6FA890;
    --primary-dark:#8CC0AA;
    --primary-tint:#22332C;
    --accent:#E8B563;
    --accent-tint:#332A17;
    --rose:#D989A0;
    --rose-tint:#332025;
    --line:#3A3B2F;
    --card:#242619;
    --card-2:#2A2C1E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  touch-action:manipulation; /* kill Android's tap-to-zoom detection delay so taps feel instant */
}
button, .btn, [onclick]{ touch-action:manipulation; }
.card[onclick], .event-item, .photo-thumb, .album-card, .qa-btn, .checklist-row, .cal-cell, .chip, .tab-item, .fab, .icon-btn, .segmented button{
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s ease, opacity .08s ease, background-color .12s ease;
}
.event-item:active, .photo-thumb:active, .album-card:active, .qa-btn:active, .checklist-row:active, .cal-cell:active, .chip:active{
  transform:scale(.96); opacity:.85;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}
.page{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

/* ---------- HERO ---------- */
.hero{
  width:100%;
  background:
    radial-gradient(680px 320px at 12% -10%, var(--accent-tint), transparent 60%),
    linear-gradient(180deg, var(--bg-2), var(--bg));
  border-bottom:1px solid var(--line);
  padding:64px 24px 56px;
}
.hero-inner{
  max-width:980px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.1fr .8fr;
  gap:48px;
  align-items:center;
}
@media (max-width:820px){ .hero-inner{grid-template-columns:1fr;} }
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--primary-dark);
  background:var(--primary-tint);
  border:1px solid color-mix(in srgb, var(--primary) 30%, transparent);
  padding:6px 12px;
  border-radius:100px;
  margin-bottom:22px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.wordmark{
  font-size:15px;
  font-weight:800;
  letter-spacing:.14em;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin:0 0 10px;
}
h1.hero-title{
  font-size:clamp(30px,4.4vw,46px);
  line-height:1.18;
  letter-spacing:-.02em;
  margin:0 0 18px;
  font-weight:800;
  text-wrap:balance;
}
h1.hero-title em{
  font-style:normal;
  color:var(--primary-dark);
  background:linear-gradient(transparent 62%, var(--accent-tint) 62%);
}
.hero-lede{
  font-size:16.5px;
  line-height:1.7;
  color:var(--ink-soft);
  max-width:46ch;
  margin:0 0 28px;
}
.hero-tags{display:flex;flex-wrap:wrap;gap:10px;}
.hero-tag{
  display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--line);
  padding:8px 13px;border-radius:100px;
  box-shadow:var(--shadow);
}
.hero-tag svg{width:15px;height:15px;stroke:var(--primary-dark);flex-shrink:0;}

/* hero art: layered cards suggesting calendar + photo + lock */
.hero-art{position:relative;height:280px;}
.art-card{
  position:absolute;
  border-radius:18px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:16px;
}
.art-cal{width:210px;height:190px;left:10%;top:6px;transform:rotate(-7deg);}
.art-cal .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.art-cal .cal-head b{font-size:13px;}
.art-cal .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.art-cal .cal-grid span{width:100%;aspect-ratio:1;border-radius:4px;background:var(--bg-2);}
.art-cal .cal-grid span.on{background:var(--accent);}
.art-cal .cal-grid span.on2{background:var(--primary);}
.art-photo{
  width:150px;height:120px;right:6%;top:0;transform:rotate(6deg);
  background:linear-gradient(135deg, var(--primary-tint), var(--accent-tint));
  display:flex;align-items:flex-end;
}
.art-photo svg{width:26px;height:26px;stroke:var(--primary-dark);}
.art-lock{
  width:150px;padding:14px 16px;right:8%;bottom:10px;transform:rotate(-4deg);
  display:flex;align-items:center;gap:10px;
}
.art-lock svg{width:20px;height:20px;stroke:var(--rose);flex-shrink:0;}
.art-lock span{font-size:12.5px;font-weight:700;color:var(--ink-soft);}

/* ---------- STAGE (interactive app) ---------- */
.stage{
  width:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:52px 20px 70px;
  background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px) 0 0/22px 22px,
    var(--bg);
}
.stage-label{
  font-size:13px;font-weight:700;color:var(--ink-soft);
  letter-spacing:.02em;margin-bottom:26px;text-align:center;
  display:flex;align-items:center;gap:8px;
}
.stage-label svg{width:15px;height:15px;stroke:var(--accent);}

.phone-frame{
  width:390px;max-width:92vw;
  height:780px;max-height:82vh;
  background:#000;
  border-radius:46px;
  padding:12px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.06) inset;
  position:relative;
}
.phone-notch{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:5;
}
.app-screen{
  width:100%;height:100%;
  background:var(--bg);
  border-radius:36px;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
  font-size:15px;
}

/* ---------- APP CHROME ---------- */
.app-bar{
  flex-shrink:0;
  padding:20px 18px 14px;
  display:flex;align-items:center;gap:10px;
  background:var(--bg);
  position:relative;z-index:2;
}
.app-bar .ab-title{font-size:18px;font-weight:800;flex:1;letter-spacing:-.01em;}
.ab-sub{font-size:12px;color:var(--ink-soft);font-weight:600;}
.icon-btn{
  width:36px;height:36px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);
  cursor:pointer;flex-shrink:0;position:relative;
}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);}
.icon-btn:active{transform:scale(.94);}
.badge-dot{
  position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--rose);border:2px solid var(--bg);
}
.app-body{
  flex:1;overflow-y:auto;padding:2px 18px 100px;
  scrollbar-width:none;
}
.app-body::-webkit-scrollbar{display:none;}

.tab-bar{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;background:var(--card);
  border-top:1px solid var(--line);
  padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);
  z-index:6;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;padding:4px 0;color:var(--ink-soft);background:none;border:none;
}
.tab-item svg{width:21px;height:21px;stroke:var(--ink-soft);}
.tab-item span{font-size:10.5px;font-weight:700;}
.tab-item.active{color:var(--primary-dark);}
.tab-item.active svg{stroke:var(--primary-dark);}

.fab{
  position:absolute;right:18px;bottom:88px;z-index:6;
  width:52px;height:52px;border-radius:16px;
  background:var(--primary);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px -6px color-mix(in srgb, var(--primary) 60%, transparent);
  cursor:pointer;
}
.fab svg{width:22px;height:22px;stroke:#fff;}
.fab:active{transform:scale(.95);}

/* ---------- GENERIC UI ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:13px;border:1px solid transparent;
  padding:13px 18px;font-size:14.5px;font-weight:700;cursor:pointer;
  width:100%;
}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary svg{stroke:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn-ghost svg{stroke:var(--ink);}
.btn-danger{background:var(--rose-tint);color:var(--rose);}
.btn-danger svg{stroke:var(--rose);}
.btn-text{background:none;border:none;color:var(--primary-dark);font-weight:700;font-size:13.5px;padding:8px;width:auto;}
.btn-sm{padding:9px 13px;font-size:13px;width:auto;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.input, textarea, select{
  width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:12px 13px;font-size:14.5px;color:var(--ink);
  font-family:inherit;
}
textarea{resize:vertical;min-height:64px;}
.input:focus, textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
.helptext{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.error-text{font-size:12.5px;color:var(--rose);margin-top:6px;font-weight:600;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:16px;box-shadow:var(--shadow);
}
.card + .card{margin-top:12px;}
.section-title{
  font-size:13px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.05em;
  margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;
}
.section-title:first-child{margin-top:6px;}

.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;
}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:100px;padding:5px 11px;font-size:12.5px;font-weight:600;
}
.switch{
  position:relative;width:44px;height:26px;border-radius:100px;
  background:var(--line);cursor:pointer;flex-shrink:0;transition:background .15s;
}
.switch.on{background:var(--primary);}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch.on::after{left:21px;}

.empty-state{
  text-align:center;padding:44px 20px;color:var(--ink-soft);
}
.empty-state svg{width:34px;height:34px;stroke:var(--line);margin-bottom:10px;}
.empty-state p{font-size:13.5px;margin:0;font-weight:600;}

.lock-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--rose-tint);color:var(--rose);
  border-radius:100px;padding:4px 9px;font-size:11.5px;font-weight:700;
}
.lock-badge svg{width:11px;height:11px;stroke:var(--rose);}

.toast{
  position:absolute;left:50%;bottom:104px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:100px;font-size:13px;font-weight:700;
  z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.3);
  animation:toastin .18s ease-out;
  white-space:nowrap;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

.modal-backdrop{
  position:absolute;inset:0;background:rgba(20,20,15,.42);z-index:15;
  display:flex;align-items:flex-end;
}
.modal-sheet{
  width:100%;background:var(--card);border-radius:26px 26px 0 0;
  padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  max-height:78%;overflow-y:auto;
  animation:sheetup .2s ease-out;
}
@keyframes sheetup{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:100px;margin:0 auto 16px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{margin:0;font-size:16px;font-weight:800;}

.member-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.member-row:last-child{border-bottom:none;}
.member-row .mname{font-weight:700;font-size:14.5px;}
.member-row .mmeta{font-size:12px;color:var(--ink-soft);}

.event-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.event-item:last-child{border-bottom:none;}
.event-time{width:52px;flex-shrink:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--primary-dark);padding-top:2px;}
.event-main{flex:1;min-width:0;}
.event-main .etitle{font-weight:700;font-size:14.5px;margin-bottom:3px;}
.event-main .emeta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.event-main .emeta svg{width:11px;height:11px;stroke:var(--ink-soft);}

.cal-wrap{padding-bottom:6px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav b{font-size:16px;font-weight:800;font-family:var(--font-num);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;cursor:pointer;position:relative;font-family:var(--font-num);
  font-size:13px;font-weight:700;color:var(--ink);
}
.cal-cell.muted{color:var(--line);}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-cell.selected{background:var(--primary);color:#fff;}
.cal-dots{display:flex;gap:2px;margin-top:3px;height:5px;}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block;}
.cal-dots i.rose{background:var(--rose);}
.cal-cell.selected .cal-dots i{background:rgba(255,255,255,.85);}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.photo-thumb{
  aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg-2);cursor:pointer;
  position:relative;
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.album-card{
  border-radius:16px;padding:14px;color:#fff;position:relative;overflow:hidden;
  height:110px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
}
.album-card .acount{font-size:11.5px;opacity:.85;font-weight:700;}
.album-card .aname{font-size:14.5px;font-weight:800;}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.segmented{display:flex;background:var(--bg-2);border-radius:12px;padding:3px;margin-bottom:16px;}
.segmented button{
  flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;
}
.segmented button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}

.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.qa-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;
}
.qa-btn svg{width:19px;height:19px;stroke:var(--primary-dark);}
.qa-btn span{font-size:11.5px;font-weight:700;}

.center-col{display:flex;flex-direction:column;justify-content:center;flex:1;padding:0 18px 40px;}
.install-banner{
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;margin:16px 0 0;box-shadow:var(--shadow);
}
.install-banner .ib-icon{
  width:38px;height:38px;border-radius:11px;background:var(--primary-tint);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.install-banner .ib-icon svg{width:18px;height:18px;stroke:var(--primary-dark);}
.install-banner .ib-text{flex:1;font-size:12.5px;line-height:1.45;color:var(--ink-soft);}
.install-banner .ib-text b{display:block;font-size:13.5px;color:var(--ink);font-weight:800;margin-bottom:1px;}
.install-banner button{
  flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:10px;
  padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.install-banner .ib-close{
  background:none;color:var(--ink-soft);padding:4px;font-size:16px;line-height:1;
}
.auth-logo{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em;}
.auth-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:32px;}
.link-row{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft);}
.link-row a{color:var(--primary-dark);font-weight:700;text-decoration:none;cursor:pointer;}

.invite-code-box{
  text-align:center;padding:26px 16px;border-radius:18px;
  background:linear-gradient(160deg, var(--primary-tint), var(--accent-tint));
  border:1px dashed color-mix(in srgb, var(--primary) 45%, transparent);
  margin-bottom:16px;
}
.invite-code{font-family:var(--font-num);font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--primary-dark);margin:8px 0;}

.checklist-row{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;}
.check-box{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.check-box.on{background:var(--primary);border-color:var(--primary);}
.check-box svg{width:13px;height:13px;stroke:#fff;display:none;}
.check-box.on svg{display:block;}

.footer{
  width:100%;border-top:1px solid var(--line);padding:26px 20px 40px;
  text-align:center;color:var(--ink-soft);font-size:12.5px;
}

/* ---------------- image resize helper ---------------- */
function fileToResizedBlob(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 1280;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      canvas.toBlob((blob)=>cb(blob), "image/jpeg", 0.82);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function timeAgo(ts){
  const diff = Math.floor((Date.now()-new Date(ts).getTime())/60000);
  if(diff<1) return "방금 전";
  if(diff<60) return diff+"분 전";
  if(diff<1440) return Math.floor(diff/60)+"시간 전";
  return Math.floor(diff/1440)+"일 전";
}

/* ---- CALENDAR ---- */
function renderCalendar(){
  const [y,m] = state.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m-1, 0).getDate();
  const events = familyEvents();
  const evByDate = {};
  events.forEach(e=>{ (evByDate[e.date] = evByDate[e.date]||[]).push(e); });

  let cells = [];
  for(let i=0;i<startDow;i++) cells.push({d: prevDays-startDow+1+i, muted:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, muted:false, dstr: y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")});
  while(cells.length % 7 !== 0) cells.push({d: cells.length, muted:true});

  const monthLabel = y+"."+String(m).padStart(2,"0");
  const dayEvents = (evByDate[state.calSelected]||[]).sort((a,b)=>a.time.localeCompare(b.time));

  return `
  <div class="cal-wrap">
    <div class="cal-nav">
      <button class="icon-btn" onclick="A.calShift(-1)">${icon('back')}</button>
      <b>${monthLabel}</b>
      <button class="icon-btn" onclick="A.calShift(1)">${icon('chevR')}</button>
    </div>
    <div class="cal-dow">${["일","월","화","수","목","금","토"].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">
      ${cells.map(c=>{
        if(c.muted) return `<div class="cal-cell muted">${c.d>0 && c.d<=31 ? c.d : ''}</div>`;
        const evs = evByDate[c.dstr]||[];
        const isToday = c.dstr === todayStr();
        const isSel = c.dstr === state.calSelected;
        return `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="A.selectDay('${c.dstr}')">
          ${c.d}
          ${evs.length? `<div class="cal-dots">${evs.slice(0,3).map(e=>`<i class="${e.is_locked?'rose':''}"></i>`).join('')}</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="section-title">${fmtDateFull(state.calSelected)}</div>
  <div class="card">
    ${dayEvents.length===0 ? emptyState('calendar','이 날 등록된 일정이 없어요') : dayEvents.map(e=>eventItemHtml(e)).join('')}
  </div>
  `;
}
function fmtDateFull(dstr){
  const d = new Date(dstr+"T00:00:00");
  const dow = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+dow+")";
}

      <div style="display:flex;align-items:center;gap:10px;">
        ${icon('lock').replace('<svg ','<svg style="width:17px;height:17px;stroke:var(--rose)" ')}
        <div style="flex:1;"><div style="font-weight:700;font-size:14px;">비공개 일정으로 설정</div><div class="helptext" style="margin-top:2px;">비밀번호를 아는 가족만 상세 내용을 볼 수 있어요</div></div>
        <div class="switch ${hasPw?'on':''}" id="pwSwitch" onclick="A.togglePwSwitch()"></div>
      </div>
      <div id="pwField" style="margin-top:14px;${hasPw?'':'display:none;'}">
        <input class="input" name="password" type="text" placeholder="${hasPw? '변경하려면 새 비밀번호 입력 (비워두면 기존 비밀번호 유지)' : '비밀번호 설정'}">
      </div>
    </div>

    <button class="btn btn-primary" type="submit">${icon('check')} ${editId? '수정 저장':'일정 등록'}</button>
  </form>`;
}

/* ---- EVENT DETAIL ---- */
function renderEventDetail(){
  const ev = getEvent(state.params.id);
  if(!ev) return emptyState('calendar','일정을 찾을 수 없어요');
  const isOwner = ev.author_id === currentUser().id;
  const locked = !!ev.is_locked && !isOwner && !state.verified[ev.id];

  if(locked){
    return `
    <div class="card" style="text-align:center;padding:36px 20px;">
      <div style="width:52px;height:52px;border-radius:16px;background:var(--rose-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        ${icon('lock').replace('<svg ','<svg style="width:24px;height:24px;stroke:var(--rose)" ')}
      </div>
      <div style="font-weight:800;font-size:16px;margin-bottom:6px;">비공개 일정입니다</div>
      <div class="helptext" style="margin-bottom:20px;">${esc(ev.author_name)}님이 비밀번호로 보호했어요. 비밀번호를 입력하면 세부 내용을 볼 수 있어요.</div>
      <form onsubmit="A.verifyPassword(event,'${ev.id}')">
        <input class="input" name="pw" type="password" placeholder="비밀번호 입력" style="text-align:center;margin-bottom:10px;" required>
        <div id="pwError" class="error-text" style="display:none;margin-bottom:10px;">비밀번호가 올바르지 않아요</div>
        <button class="btn btn-primary" type="submit">확인</button>
      </form>
    </div>`;
  }

  return `
  <div class="card">
    ${ev.is_locked? `<div class="lock-badge" style="margin-bottom:10px;">${icon('lock')} 비공개 일정</div>`:''}
    <div style="font-size:19px;font-weight:800;margin-bottom:14px;">${esc(ev.title)}</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;gap:10px;align-items:center;font-size:14px;">${icon('clock').replace('<svg ','<svg style="width:17px;height:17px;stroke:var(--ink-soft)" ')}${fmtDateFull(ev.date)} · ${esc(ev.time)}</div>
      <div style="display:flex;gap:10px;align-items:center;font-size:14px;">${icon('pin').replace('<svg ','<svg style="width:17px;height:17px;stroke:var(--ink-soft)" ')}${esc(ev.location||'장소 미정')}</div>
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:14px;">${icon('users').replace('<svg ','<svg style="width:17px;height:17px;stroke:var(--ink-soft);margin-top:1px;" ')}
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${ev.participants.map(p=>`<span class="chip">${esc(p)}</span>`).join('')||'-'}</div>
      </div>
      ${ev.prep ? `<div style="display:flex;gap:10px;align-items:flex-start;font-size:14px;">${icon('edit').replace('<svg ','<svg style="width:17px;height:17px;stroke:var(--ink-soft);margin-top:1px;" ')}<div>${esc(ev.prep)}</div></div>`:''}
    </div>
    <div class="helptext" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px;">${esc(ev.author_name)}님이 등록</div>
  </div>
  ${isOwner ? `
  <div style="display:flex;gap:10px;margin-top:14px;">
    <button class="btn btn-ghost" onclick="A.openEventForm(null,'${ev.id}')">${icon('edit')} 수정</button>
    <button class="btn btn-danger" onclick="A.cancelEvent('${ev.id}')">${icon('trash')} 취소</button>
  </div>` : ''}
  `;
}

/* ---- ALBUMS ---- */
function renderAlbums(){
  const albums = familyAlbums();
  return `
  <div class="segmented">
    <button class="${state.albumView==='album'?'active':''}" onclick="A.setAlbumView('album')">앨범별</button>
    <button class="${state.albumView==='date'?'active':''}" onclick="A.setAlbumView('date')">날짜별</button>
  </div>
  ${state.albumView==='album' ? renderAlbumGrid(albums) : renderPhotosByDate()}
  `;
}
function renderAlbumGrid(albums){
  if(albums.length===0) return emptyState('album','아직 만든 앨범이 없어요');
  const grads = ["linear-gradient(160deg,#3B6E5E,#2A5346)","linear-gradient(160deg,#E8A23D,#C97F1F)","linear-gradient(160deg,#C4577A,#9C3C5C)","linear-gradient(160deg,#5B7DB1,#3E5C87)"];
  return `<div class="album-grid">${albums.map((a,i)=>{
    const count = familyPhotos(a.id).length;
    return `<div class="album-card" style="background:${grads[i%grads.length]}" onclick="A.nav('albumDetail',{id:'${a.id}'})">
      <div class="aname">${esc(a.name)}</div><div class="acount">사진 ${count}장</div>
    </div>`;
  }).join('')}</div>`;
}
function renderPhotosByDate(){
  const photos = familyPhotos().sort((a,b)=>b.date.localeCompare(a.date));
  if(photos.length===0) return emptyState('camera','아직 올라온 사진이 없어요');
  const groups = {};
  photos.forEach(p=>{ (groups[p.date]=groups[p.date]||[]).push(p); });
  return Object.keys(groups).sort().reverse().map(date=>`
    <div class="section-title" style="margin-top:18px;">${fmtDateFull(date)}</div>
    <div class="photo-grid">${groups[date].map(p=>`<div class="photo-thumb" onclick="A.openPhoto('${p.id}')">${photoInner(p)}</div>`).join('')}</div>
  `).join('');
}

function renderAlbumDetail(){
  const album = getAlbum(state.params.id);
  if(!album) return emptyState('album','앨범을 찾을 수 없어요');
  const photos = familyPhotos(album.id);
  return `
  <input type="file" id="photoFileInput" accept="image/*" style="display:none;" onchange="A.uploadPhoto(event,'${album.id}')">
  <button class="btn btn-primary" style="margin-bottom:16px;" onclick="document.getElementById('photoFileInput').click()">${icon('camera')} 사진 업로드</button>
  ${photos.length===0 ? emptyState('camera','이 앨범에는 아직 사진이 없어요') :
    `<div class="photo-grid">${photos.map(p=>`<div class="photo-thumb" onclick="A.openPhoto('${p.id}')">${photoInner(p)}</div>`).join('')}</div>`}
  `;
}

function renderPhotoViewer(){
  const p = getPhoto(state.params.id);
  if(!p) return emptyState('camera','사진을 찾을 수 없어요');
  return `
  <div style="border-radius:16px;overflow:hidden;aspect-ratio:1;margin-bottom:14px;">${photoInner(p)}</div>
  <div class="card">
    <div style="font-weight:700;font-size:15px;margin-bottom:6px;">${esc(p.caption || "사진")}</div>
    <div class="helptext">${esc(p.uploader_name)}님이 ${fmtDateFull(p.date)}에 업로드</div>
  </div>`;
}

/* ================= ACTIONS ================= */
const actions = {
  nav(screen, params, replace){ nav(screen, params, {replace}); },
  back(){ goBack(); },
  setTab(t){ setTab(t); },
  toggleNotif(){ state.showNotif = !state.showNotif; render(); },

  installApp(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(()=>{
      deferredInstallPrompt = null;
      installState.available = false;
      render();
    });
  },
  dismissInstall(){
    installState.dismissed = true;
    sessionStorage.setItem("famshare.installDismissed", "1");
    render();
  },
  showIosHelp(){ state.showIosHelp = true; render(); },
  hideIosHelp(){ state.showIosHelp = false; render(); },
  async enablePush(){
    try{
      const perm = await Notification.requestPermission();
      pushState.permission = perm;
      if(perm !== "granted"){ render(); return; }
      await subscribeToPush();
      showToast("휴대폰 알림을 켰어요");
    }catch(err){
      showToast("알림 설정에 실패했어요");
    }
    render();
  },
  dismissPush(){
    pushState.dismissed = true;
    sessionStorage.setItem("famshare.pushDismissed", "1");
    render();
  },
  async doSignup(e){
    e.preventDefault();
    const f = e.target;
    const name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), pass = f.pass.value;
    const btn = f.querySelector("button[type=submit]");
    const errBox = document.getElementById("signupError");
    errBox.style.display = "none";
    if(!/^[a-z0-9_]{4,20}$/.test(username)){ errBox.textContent = "아이디는 영문/숫자/_ 4~20자로 입력해주세요"; errBox.style.display="block"; return; }
    btn.disabled = true;
    const email = usernameToEmail(username);
    const { data, error } = await supabase.auth.signUp({ email, password: pass, options: { data: { name, username } } });
    btn.disabled = false;
    if(error){
      errBox.textContent = error.message.includes("already registered") ? "이미 사용 중인 아이디예요" : error.message;
      errBox.style.display="block";
      return;
    }
    if(!data.session){
      showToast("가입 완료! 로그인해주세요");
      state.stack=[]; nav("login", null, {replace:true});
      return;
    }
    await establishSession(data.user);
  },
  async doLogin(e){
    e.preventDefault();
    const f = e.target;
    const username = f.username.value.trim().toLowerCase(), pass = f.pass.value;
    const btn = f.querySelector("button[type=submit]");
    const errBox = document.getElementById("loginError");
    errBox.style.display = "none";
    btn.disabled = true;
    const { data, error } = await supabase.auth.signInWithPassword({ email: usernameToEmail(username), password: pass });
    btn.disabled = false;
    if(error){
      errBox.textContent = /confirm/i.test(error.message) ? "관리자에게 문의해주세요 (계정 인증 오류)" : "아이디 또는 비밀번호가 올바르지 않아요";
      errBox.style.display="block";
      return;
    }
    await establishSession(data.user);
  },
  async logout(){
    await supabase.auth.signOut();
  },

  async doCreateFamily(e){
    e.preventDefault();
    const name = e.target.fname.value.trim();
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    let family = null, lastErr = null;
    for(let i=0;i<3;i++){
      const code = "FAM"+Math.floor(1000+Math.random()*9000);
      const res = await supabase.from("families").insert({ name, invite_code: code, created_by: me.id }).select().single();
      if(!res.error){ family = res.data; break; }
      lastErr = res.error;
    }
    if(!family){ btn.disabled=false; showToast("가족 공간을 만들지 못했어요"); return; }
    await supabase.from("profiles").update({ family_id: family.id }).eq("id", me.id);
    await supabase.from("albums").insert({ family_id: family.id, name: "우리 가족 앨범" });
    me.family_id = family.id;
    await loadFamily(family.id);
    state.stack=[]; state.screen="home"; state.tab="home"; render();
    showToast("가족 공간이 생성되었어요");
  },
  async doJoinFamily(e){
    e.preventDefault();
    const code = e.target.code.value.trim().toUpperCase();
    const errBox = document.getElementById("joinError");
    errBox.style.display = "none";
    const { data: family, error } = await supabase.from("families").select("*").eq("invite_code", code).maybeSingle();
    if(error || !family){ errBox.textContent = "일치하는 초대 코드를 찾을 수 없어요"; errBox.style.display="block"; return; }
    await supabase.from("profiles").update({ family_id: family.id }).eq("id", me.id);
    me.family_id = family.id;
    await loadFamily(family.id);
    await pushNotif("member", `${me.name}님이 가족 공간에 참여했어요`);
    await refreshAll();
    state.stack=[]; state.screen="home"; state.tab="home"; render();
    showToast(`${family.name}에 참여했어요`);
  },

  async shareCode(){
    const f = currentFamily();
    try{
      await navigator.share({
        title: "가족모아 초대",
        text: `${f.name}에 초대할게요! 가족모아 앱에서 회원가입 후 초대 코드 [${f.invite_code}]를 입력해주세요.\nhttps://seoyunha87-arch.github.io/gajok-moa/`,
      });
    }catch(err){ /* user cancelled the share sheet - ignore */ }
  },
  copyCode(){
    const f = currentFamily();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(f.invite_code)
        .then(()=>showToast("초대 코드를 복사했어요"))
        .catch(()=>showToast(`복사에 실패했어요 — 코드: ${f.invite_code}`));
    } else {
      showToast(`이 코드를 알려주세요: ${f.invite_code}`);
    }
  },

  selectDay(d){ state.calSelected = d; render(); },
  calShift(dir){
    let [y,m] = state.calMonth.split("-").map(Number);
    m += dir; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    state.calMonth = y+"-"+String(m).padStart(2,"0"); render();
  },

  openEventForm(date, editId){ nav("eventForm", {date, editId}); },
  toggleChip(el){ el.querySelector(".check-box").classList.toggle("on"); },
  togglePwSwitch(){
    const sw = document.getElementById("pwSwitch");
    const field = document.getElementById("pwField");
    sw.classList.toggle("on");
    field.style.display = sw.classList.contains("on") ? "block" : "none";
    if(!sw.classList.contains("on")) field.querySelector("input").value = "";
  },
  async saveEvent(e, editId){
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector("button[type=submit]");
    const participants = Array.from(f.querySelectorAll(".check-box.on")).map(el=>el.dataset.name);
    const isPw = document.getElementById("pwSwitch").classList.contains("on");
    const pwTyped = isPw ? f.password.value.trim() : "";
    const family = currentFamily();
    btn.disabled = true;

    const base = {
      title: f.title.value.trim(), date: f.date.value, "time": f.time.value,
      location: f.location.value.trim(), participants, prep: f.prep.value.trim(),
    };
    if(!isPw) base.password = null;
    else if(pwTyped) base.password = pwTyped;

    if(editId){
      const { error } = await supabase.from("events").update(base).eq("id", editId);
      btn.disabled = false;
      if(error){ showToast("수정하지 못했어요"); return; }
      await pushNotif("event", `${me.name}님이 '${base.title}' 일정을 수정했어요`);
      await refreshAll();
      showToast("일정을 수정했어요");
      nav("eventDetail", {id:editId}, {replace:true});
    } else {
      const { data, error } = await supabase.from("events").insert({
        ...base, family_id: family.id, author_id: me.id, author_name: me.name,
      }).select("id").single();
      btn.disabled = false;
      if(error){ showToast("등록하지 못했어요"); return; }
      await pushNotif("event", `${me.name}님이 '${base.title}' 일정을 등록했어요`);
      state.calSelected = base.date;
      await refreshAll();
      nav("eventDetail", {id:data.id}, {replace:true});
    }
  },
  openEvent(id){ nav("eventDetail", {id}); },
  async verifyPassword(e, id){
    e.preventDefault();
    const pw = e.target.pw.value;
    const { data, error } = await supabase.rpc("unlock_event", { _event_id: id, _password: pw });
    if(error || !data || data.length===0){ document.getElementById("pwError").style.display = "block"; return; }
    const full = data[0];
    const ev = getEvent(id);
    if(ev) Object.assign(ev, full);
    state.verified[id] = true;
    render();
  },
  async cancelEvent(id){
    const ev = getEvent(id);
    if(!confirm(`'${ev.title}' 일정을 취소할까요?`)) return;
    const { error } = await supabase.from("events").delete().eq("id", id);
    if(error){ showToast("취소하지 못했어요"); return; }
    await pushNotif("event", `${me.name}님이 '${ev.title}' 일정을 취소했어요`);
    showToast("일정을 취소했어요");
    await refreshAll();
    goBack();
  },

  setAlbumView(v){ state.albumView = v; render(); },
  async newAlbumPrompt(){
    const name = prompt("새 앨범 이름을 입력하세요");
    if(!name || !name.trim()) return;
    const { error } = await supabase.from("albums").insert({ family_id: currentFamily().id, name: name.trim() });
    if(error){ showToast("앨범을 만들지 못했어요"); return; }
    await refreshAll();
    showToast("앨범을 만들었어요");
  },
  openPhoto(id){ nav("photoViewer", {id}); },
  uploadPhoto(e, albumId){
    const file = e.target.files[0];
    if(!file) return;
    showToast("업로드 중...");
    fileToResizedBlob(file, async (blob)=>{
      const family = currentFamily();
      const path = `${family.id}/${uuid()}.jpg`;
      const { error: upErr } = await supabase.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
      if(upErr){ showToast("업로드하지 못했어요"); return; }
      const { error } = await supabase.from("photos").insert({
        album_id: albumId, family_id: family.id, storage_path: path,
        caption: "", uploader_id: me.id, uploader_name: me.name, date: todayStr(),
      });
      if(error){ showToast("업로드하지 못했어요"); return; }
      const album = getAlbum(albumId);
      await pushNotif("photo", `${me.name}님이 '${album ? album.name : "앨범"}'에 사진을 올렸어요`);
      await refreshAll();
      showToast("사진을 업로드했어요");
    });
    e.target.value = "";
  },
};

function attachGlobalHandlers(){}

boot();
})();
</script>
